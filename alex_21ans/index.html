<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pour mon bestie</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Georgia", serif;
            background: #f8f1e8;
            color: #3d3028;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 850px;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .intro {
            font-size: 18px;
            margin-bottom: 35px;
            opacity: 0.8;
        }

        .photo-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #photo {
            width: 100%;
            max-width: 650px;
            height: 450px;
            object-fit: cover;
            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0,0,0,0.2);

            transition: opacity 0.3s ease;
        }

        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            width: 55px;
            height: 55px;

            border: none;
            border-radius: 50%;

            background: white;
            color: #3d3028;

            font-size: 30px;
            cursor: pointer;

            box-shadow: 0 5px 15px rgba(0,0,0,0.2);

            transition: transform 0.2s, background 0.2s;
        }

        .arrow:hover {
            transform: translateY(-50%) scale(1.1);
            background: #eee4d8;
        }

        .left {
            left: -25px;
        }

        .right {
            right: -25px;
        }

        .text {
            max-width: 650px;
            margin: 30px auto 0;
        }

        #title {
            font-size: 28px;
            margin-bottom: 15px;
        }

        #description {
            font-size: 18px;
            line-height: 1.7;
        }

        .counter {
            margin-top: 25px;
            opacity: 0.6;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 32px;
            }

            #photo {
                height: 350px;
            }

            .arrow {
                width: 45px;
                height: 45px;
                font-size: 24px;
            }

            .left {
                left: -10px;
            }

            .right {
                right: -10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Pour mon bestie</h1>

        <p class="intro">
            21 ans déjà !! Le temps passe trop vite donc je te propose de revoir quelques petits moments qu'on a passé ensemble ces 3 dernières années
        </p>

        <div class="photo-container">

            <button class="arrow left" onclick="previousPhoto()">
                ❮
            </button>

            <img id="photo" src="photos/premiere.png" alt="Souvenir">

            <button class="arrow right" onclick="nextPhoto()">
                ❯
            </button>

        </div>

        <div class="text">

            <h2 id="title">
                Notre première rencontre à l'IUT
            </h2>

            <p id="description">
                Un bestie tout timide
            </p>

        </div>

        <div class="counter">
            <span id="counter">1</span> / <span id="total"></span>
        </div>

    </div>


    <script>

        const memories = [

            {
                photo: "photos/premiere.png",
                title: "Notre première rencontre à l'IUT",
                description:
                "Je devais te donner un porte clé thor mais t'étais gv stressé"
            },

            {
                photo: "photos/crous.png",
                title: "Un vrai guide investi",
                description:
                "Premier repas au crous que tu m'as fais découvrir"
            },

            {
                photo: "photos/cours1.png",
                title: "Le duo inséparable",
                description:
                "Un pro de l'informatique qui me donnait des cours de soutien"
            },

            {
                photo: "photos/halloween.png",
                title: "Halloween et road trip chez Action",
                description:
                "Premier halloween ensemble ou tu avais fais une citrouille roblox. T'aurais dû te déguiser en thor"
            },

            {
                photo: "photos/newyear.png",
                title: "Nouvel an 2024-25",
                description:
                "Le chapeau t'allait gv bien vrmt"
            },

            {
                photo: "photos/g8.png",
                title: "préparation à la St Valentin en duo",
                description:
                "Un fan de gentle mates très investi. J'espère que tu portes le maillot devant chaque match"
            },

            {
                photo: "photos/salle.png",
                title: "Seance bras",
                description:
                "Un bestie plus fort que hulk (ou thor si tu préfères)"
            },

            {
                photo: "photos/fille.png",
                title: "Alexa",
                description:
                "Un avant goût de tes futures filles"
            },

            {
                photo: "photos/otuke.png",
                title: "Otuke chez Rémi",
                description:
                "Tu faisais déjà un coeur otuke avec tes mains sans t'en rendre compte"
            },

            {
                photo: "photos/bg.png",
                title: "Soirée wii",
                description:
                "A defaut de pas nous battre sur la wii t'as au moins eu un beau mii"
            }

        ];


        let currentPhoto = 0;


        const photo = document.getElementById("photo");
        const title = document.getElementById("title");
        const description = document.getElementById("description");
        const counter = document.getElementById("counter");
        const total = document.getElementById("total");


        total.textContent = memories.length;


        function showPhoto(index) {

            const memory = memories[index];

            photo.style.opacity = 0;

            setTimeout(() => {

                photo.src = memory.photo;
                title.textContent = memory.title;
                description.textContent = memory.description;

                counter.textContent = index + 1;

                photo.style.opacity = 1;

            }, 200);
        }


        function nextPhoto() {

            currentPhoto++;

            if (currentPhoto >= memories.length) {
                currentPhoto = 0;
            }

            showPhoto(currentPhoto);
        }


        function previousPhoto() {

            currentPhoto--;

            if (currentPhoto < 0) {
                currentPhoto = memories.length - 1;
            }

            showPhoto(currentPhoto);
        }


        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowRight") {
                nextPhoto();
            }

            if (event.key === "ArrowLeft") {
                previousPhoto();
            }

        });

    </script>

</body>
</html>
